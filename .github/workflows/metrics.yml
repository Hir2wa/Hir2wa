name: GitHub metrics

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # Overview: commits, PRs, issues, repos — private contributions included
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.overview.svg
          base: header, activity, repositories
          config_timezone: Africa/Kigali
          config_display: large
          repositories_affiliations: owner, collaborator

      # Most used languages across public and private repos; indepth counts
      # only lines from your own commits, so teammates' code is left out
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.languages.svg
          base: ""
          config_timezone: Africa/Kigali
          repositories_affiliations: owner, collaborator
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_threshold: 1%
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 30
